id: calagopus-wings
name: Calagopus Wings
version: "1.2.0"
description: A rewrite of Pterodactyl Wings in the Rust programming language. This rewrite aims to be 100% API compatible while implementing new features, better performance and more stability.
icon: https://serverkit.ai/imgs/template-icons/calagopus.svg
website: https://calagopus.com
documentation: https://calagopus.com/docs
categories:
  - gaming

ports:
  - port: 8080
    protocol: tcp
    description: Panel API Port
  - port: 2022
    protocol: tcp
    description: Wing Port

compose:
  services:
  wings:
    image: ghcr.io/calagopus/wings:1.2.0
    restart: unless-stopped
    environment:
      TZ: "Europe/Berlin"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: calagopus
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      # this is exclusively for the main wings configuration file, called config.yml
      - "./config/:/etc/calagopus-wings/"
      # if you split /var/lib/calagopus-wings up, make sure the following paths are all still covered by a volume:
      # /var/lib/calagopus-wings/volumes (used for storing server files)
      # /var/lib/calagopus-wings/diffs (used for storing file history diffs)
      # /var/lib/calagopus-wings/vmounts (used for storing temporary mountpoints, DO NOT put this on a tmpfs, thats why its separate)
      # /var/lib/calagopus-wings/archives (unused for wings-rs currently, may get a future use)
      # /var/lib/calagopus-wings/backups (used for storing local backups of servers)
      - "/var/lib/calagopus-wings/:/var/lib/calagopus-wings/"
      - "./logs/:/var/log/calagopus-wings/"
      - "/tmp/calagopus-wings/:/tmp/calagopus-wings/"
      # do not mount directly to /etc/ssl/certs (right side), this will cause certificate issues within the container
      - "/etc/ssl/certs/wings/:/etc/ssl/certs/wings/:ro"
    ports:
      - 8080:8080
      - 2022:2022

post_install: |
  Before starting Wings, you need to register the node in the panel and get its configuration. 
  Follow the Configuring a New Node guide to create the node, then copy the configuration content from the Node Configuration page in the panel to the config/config.yml.